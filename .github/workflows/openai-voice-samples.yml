name: Generate OpenAI phonics audio library

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openai-voice-samples.yml'
      - 'scripts/generate_openai_audio.py'
      - 'game-src/src/App.tsx'
      - 'game-src/src/assets/vowels/index.ts'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate and validate every source MP3
        env:
          OPENAI_API_KEY: ${{ secrets.openaivoice }}
        run: python3 scripts/generate_openai_audio.py
      - name: Build the site and refresh docs/
        working-directory: game-src
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Save the playable preview and full rebuilt site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-audio-library-preview
          path: |
            audio-review/
            game-src/src/assets/
            docs/
          if-no-files-found: warn
          retention-days: 14
